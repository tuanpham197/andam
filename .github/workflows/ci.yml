name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Unit + integration + e2e (Testcontainers uses the runner's Docker); fails below 100% lines.
      - run: npm run test:cov
      # Timing budgets run uninstrumented, after the coverage run.
      - run: npm run test:perf --workspace apps/api

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run openapi:export --workspace apps/api
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
          JWT_SECRET: openapi-export-only-openapi-export-only
      - run: npm run generate --workspace packages/api-client
      - name: Generated API client is committed and up to date
        run: git diff --exit-code -- apps/api/openapi.json packages/api-client/src/generated

  build:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
